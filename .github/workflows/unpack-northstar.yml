name: Import NORTHSTAR project
on:
  push:
    branches: [main]
    paths:
      - "northstar-payload/tarpart-*.b64"
      - ".github/workflows/unpack-northstar.yml"
permissions:
  contents: write
jobs:
  unpack-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Reconstruct project archive
        run: |
          cat northstar-payload/tarpart-*.b64 > /tmp/northstar.tar.xz.b64
          base64 --decode /tmp/northstar.tar.xz.b64 > /tmp/northstar.tar.xz
          tar -xJf /tmp/northstar.tar.xz -C .
          rm -rf northstar-payload
          rm -f /tmp/northstar.tar.xz /tmp/northstar.tar.xz.b64
      - name: Commit extracted Android source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: import NORTHSTAR Android project v2"
            git push
          fi
