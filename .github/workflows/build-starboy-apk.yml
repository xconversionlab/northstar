name: Build STARBOY Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "northstar-android/**"
      - ".github/workflows/build-starboy-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Test and build installable APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: northstar-android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify build environment
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Set up Node.js for backend validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Type-check Gemini backend
        run: npm run typecheck

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build STARBOY debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare named APK
        run: |
          mkdir -p release
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk release/STARBOY-debug.apk
          sha256sum release/STARBOY-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: STARBOY-debug-apk
          path: northstar-android/release/STARBOY-debug.apk
          if-no-files-found: error
          retention-days: 14
